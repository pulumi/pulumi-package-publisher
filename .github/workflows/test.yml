name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nodejs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lang/nodejs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: lang/nodejs/package-lock.json
      - run: npm ci
      - run: npm test
