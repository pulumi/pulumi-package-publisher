name: 'Publish to PyPi'
description: |
  A subcomponent of pulumi-package-publish

inputs:
  version:
    description: >-
      The version of the provider being published.

      TODO: Validate that the SDK we are publishing matches this input.
    required: true
  pypiTrustedPublishing:
    description: Publish to PyPI using trusted publishing instead of PYPI_USERNAME/PYPI_PASSWORD.
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Download python SDK
      uses: actions/download-artifact@v4
      with:
        name: python-sdk.tar.gz
        path: ${{ github.workspace }}/sdk/
    - name: Uncompress python SDK
      run: mkdir -p ${{ github.workspace }}/sdk/python && tar -zxf ${{ github.workspace }}/sdk/python.tar.gz -C
        ${{ github.workspace }}/sdk/python
      shell: bash
    - name: Assert PyPI trusted publishing prerequisites
      if: ${{ inputs.pypiTrustedPublishing == 'true' }}
      run: |
        set -euo pipefail

        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "PyPI trusted publishing requires GitHub Actions OIDC. Set 'id-token: write' on this job."
          exit 1
        fi

        if [[ -n "${PYPI_PASSWORD:-}" ]]; then
          echo "pypiTrustedPublishing is enabled, but PYPI_PASSWORD is set. Remove PYPI_PASSWORD to publish with OIDC."
          exit 1
        fi
      shell: bash
    - name: Publish Python SDK
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: ${{ github.workspace }}/sdk/python/bin/dist/
        skip-existing: true
        verbose: true
        user: ${{ inputs.pypiTrustedPublishing == 'true' && '__token__' || env.PYPI_USERNAME || 'pulumi' }}
        password: ${{ inputs.pypiTrustedPublishing != 'true' && env.PYPI_PASSWORD || '' }}
        attestations: ${{ inputs.pypiTrustedPublishing == 'true' }}
