name: 'Publish to NPM'
description: |
  A subcomponent of pulumi-package-publish

inputs:
  version:
    description: The version of the provider being published.
    required: true
  npmTrustedPublishing:
    description: Publish to npm using trusted publishing instead of NODE_AUTH_TOKEN.
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Download nodejs SDK
      uses: actions/download-artifact@v4
      with:
        name: nodejs-sdk.tar.gz
        path: ${{ github.workspace }}/sdk/
    - name: Uncompress nodejs SDK
      run: mkdir -p ${{ github.workspace }}/sdk/nodejs && tar -zxf ${{ github.workspace }}/sdk/nodejs.tar.gz -C
        ${{ github.workspace }}/sdk/nodejs
      shell: bash
    - name: Validate Package Version
      shell: bash
      # Ensure that we are publishing only the version that we expect (and that is set in
      # inputs.version). Otherwise we could publish a version that doesn't match what we
      # are trying to publish.
      run: >-
        ACTUAL="v$(cat ${{ github.workspace }}/sdk/nodejs/bin/package.json | jq .version --raw-output)" &&
        JS="$(pulumictl convert-version --version "${{ inputs.version }}" --language javascript)" &&
        if [[ "$ACTUAL" != "$JS" ]]; then
          echo "Found version $ACTUAL does not match expected version $JS";
          exit 1;
        fi
    - name: Assert npm trusted publishing prerequisites
      if: ${{ inputs.npmTrustedPublishing == 'true' }}
      run: |
        set -euo pipefail

        if [[ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
          echo "npm trusted publishing requires a GitHub-hosted runner."
          exit 1
        fi

        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
          echo "npm trusted publishing requires GitHub Actions OIDC. Set 'id-token: write' on this job."
          exit 1
        fi

        if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
          echo "npmTrustedPublishing is enabled, but NODE_AUTH_TOKEN is set. Remove NODE_AUTH_TOKEN to publish with OIDC."
          exit 1
        fi

        npm_version="$(npm --version)"
        node - "$npm_version" <<'NODE'
        const actual = process.argv[2];
        const required = "11.5.1";
        const parse = version => version.split("-")[0].split(".").map(part => Number(part));
        const [actualMajor, actualMinor, actualPatch] = parse(actual);
        const [requiredMajor, requiredMinor, requiredPatch] = parse(required);
        const ok = actualMajor > requiredMajor
          || (actualMajor === requiredMajor && actualMinor > requiredMinor)
          || (actualMajor === requiredMajor && actualMinor === requiredMinor && actualPatch >= requiredPatch);
        if (!ok) {
          console.error(`npm trusted publishing requires npm >= ${required}; found ${actual}`);
          process.exit(1);
        }
        NODE
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
    - name: Run npm whoami
      if: ${{ inputs.npmTrustedPublishing != 'true' }}
      run: npm whoami
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
    - name: Publish Node
      run: pulumi package publish-sdk nodejs --path ${{ github.workspace }}/sdk/nodejs/bin
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ env.NODE_AUTH_TOKEN }}
